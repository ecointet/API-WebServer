# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: flight-status.docs.buildwithfern.com

title: FIDS API

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
  content-alignment: left

tabs:
  home:
    display-name: Overview
    icon: fa-duotone fa-tower-control
  api:
    display-name: API Reference
    icon: fa-duotone fa-code

navigation:
  - tab: home
    layout:
      - section: Getting Started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-plane-departure
          - page: Quick Start
            path: docs/pages/quickstart.mdx
            icon: fa-duotone fa-bolt
          - page: Flight Statuses
            path: docs/pages/flight-statuses.mdx
            icon: fa-duotone fa-signal-bars

  - tab: api
    layout:
      - section: Overview
        contents:
          - page: API Overview
            path: docs/pages/api-reference-overview.mdx
            icon: fa-duotone fa-book-open
      - api: Flights API
        slug: flights-api
        flattened: true

navbar-links:
  - type: minimal
    text: Live Board
    url: https://api.cointet.com/web/index.html
  - type: filled
    text: Try the API
    url: https://api.cointet.com/flights

colors:
  accent-primary:
    dark: "#f5b800"
    light: "#b8860b"
  background:
    dark: "#060b18"
    light: "#f5f2e8"
  border:
    dark: "#1a2744"
    light: "#d4c88c"
  card-background:
    dark: "#0d1626"
    light: "#ffffff"
  sidebar-background:
    dark: "#080f1e"
    light: "#ede9d8"
  header-background:
    dark: "#0d1626"
    light: "#ede9d8"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo-light.svg
  height: 26

favicon: docs/assets/favicon.svg

css:
  - styles.css

typography:
  headingsFont:
    name: Space Grotesk
  bodyFont:
    name: Inter
  codeFont:
    name: JetBrains Mono

ai-search: {}
