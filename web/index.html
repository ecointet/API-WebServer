<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDS — Flight Information Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:            #060b18;
            --bg-panel:      #0d1626;
            --bg-row-hover:  #111c35;
            --amber:         #f5b800;
            --amber-dim:     #7a5f00;
            --text:          #d9c896;
            --text-dim:      #5a4e2e;
            --border:        #111f3a;

            --s-scheduled: #94a3b8;
            --s-boarding:  #22d3ee;
            --s-departed:  #60a5fa;
            --s-in_flight: #38bdf8;
            --s-landed:    #4ade80;
            --s-arrived:   #86efac;
            --s-delayed:   #fb923c;
            --s-cancelled: #f87171;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--amber);
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* CRT scanline overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0, 0, 0, 0.07) 3px,
                rgba(0, 0, 0, 0.07) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ─── Header ─────────────────────────────────────── */
        header {
            background: var(--bg-panel);
            border-bottom: 2px solid var(--amber);
            padding: 18px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo-block { display: flex; align-items: center; gap: 20px; }

        .plane-icon {
            font-size: 2.4rem;
            line-height: 1;
            filter: drop-shadow(0 0 12px rgba(245,184,0,0.6));
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-weight: 800;
            font-size: 1.9rem;
            letter-spacing: 6px;
            color: var(--amber);
            text-shadow: 0 0 24px rgba(245,184,0,0.45);
        }

        .logo-sub {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .clock-block { text-align: right; }

        .clock {
            font-family: 'Orbitron', monospace;
            font-size: 2.1rem;
            font-weight: 400;
            color: var(--amber);
            letter-spacing: 4px;
            text-shadow: 0 0 18px rgba(245,184,0,0.4);
        }

        .date-line {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            margin-top: 4px;
        }

        /* ─── Control bar ─────────────────────────────────── */
        .controls {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 11px 36px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ctrl-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-right: 4px;
            flex-shrink: 0;
        }

        .sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; flex-shrink: 0; }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--amber-dim);
            color: var(--text-dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            padding: 5px 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.12s;
            text-transform: uppercase;
        }

        .filter-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
            background: rgba(245,184,0,0.05);
        }

        .filter-btn.active {
            background: var(--amber);
            border-color: var(--amber);
            color: var(--bg);
        }

        .spacer { flex: 1 1 auto; }

        .live-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            border: 1px solid #1a3020;
            padding: 4px 12px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px #4ade80; }
            50%       { opacity: 0.25; box-shadow: none; }
        }

        /* ─── Board header ────────────────────────────────── */
        .board-meta {
            padding: 18px 36px 10px;
            display: flex;
            align-items: baseline;
            gap: 14px;
        }

        .board-title {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 5px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .board-count {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        /* ─── Table ───────────────────────────────────────── */
        .table-wrap {
            padding: 0 28px 48px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 820px;
        }

        thead tr {
            border-bottom: 1px solid var(--amber-dim);
        }

        th {
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--amber-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 10px 14px;
            text-align: left;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }

        tbody tr:hover { background: var(--bg-row-hover); }

        td {
            padding: 15px 14px;
            font-size: 0.88rem;
            letter-spacing: 1px;
            vertical-align: middle;
        }

        /* Flight code */
        .c-code {
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 2px;
            color: var(--amber);
            white-space: nowrap;
        }

        /* Airline */
        .c-airline {
            color: var(--text);
            font-size: 0.78rem;
            white-space: nowrap;
        }

        /* Airport cell */
        .iata {
            font-size: 1.0rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--amber);
            display: block;
        }
        .apt-name {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            display: block;
            margin-top: 2px;
            white-space: nowrap;
        }

        /* Time cell */
        .c-time { white-space: nowrap; }
        .time-sched {
            display: block;
            color: var(--text);
            font-size: 0.95rem;
            letter-spacing: 2px;
        }
        .time-actual {
            display: block;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 3px;
        }
        .time-actual.late { color: var(--s-delayed); }

        /* Status badge */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.6rem;
            letter-spacing: 2px;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            border: 1px solid currentColor;
            white-space: nowrap;
        }

        .s-scheduled { color: var(--s-scheduled); }
        .s-boarding  { color: var(--s-boarding);  animation: blink-badge 1.5s ease-in-out infinite; }
        .s-departed  { color: var(--s-departed); }
        .s-in_flight { color: var(--s-in_flight); }
        .s-landed    { color: var(--s-landed); }
        .s-arrived   { color: var(--s-arrived); }
        .s-delayed   { color: var(--s-delayed); }
        .s-cancelled { color: var(--s-cancelled); }

        @keyframes blink-badge {
            0%, 100% { opacity: 1;    box-shadow: 0 0 8px var(--s-boarding); }
            50%       { opacity: 0.4; box-shadow: none; }
        }

        /* Gate cell */
        .c-gate { white-space: nowrap; color: var(--text); font-size: 0.85rem; }
        .c-gate .term {
            display: block;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 3px;
        }

        /* Row states */
        tr.row-cancelled td { opacity: 0.4; }
        tr.row-cancelled .c-code { text-decoration: line-through; }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 72px;
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 4px;
        }

        /* ─── Legend ──────────────────────────────────────── */
        .legend {
            padding: 0 36px 32px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            border-top: 1px solid var(--border);
            padding-top: 18px;
            margin: 0 28px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--text-dim);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        @media (max-width: 700px) {
            header { padding: 12px 16px; }
            .logo-text { font-size: 1.3rem; }
            .clock { font-size: 1.5rem; }
            .controls { padding: 10px 16px; }
            .board-meta { padding: 14px 16px 8px; }
            .table-wrap { padding: 0 0 32px; }
            .legend { margin: 0; padding: 14px 16px 24px; }
        }
    </style>
</head>
<body>

<!-- ─── Header ─────────────────────────────────────────── -->
<header>
    <div class="logo-block">
        <div class="plane-icon">✈</div>
        <div>
            <div class="logo-text">FIDS</div>
            <div class="logo-sub">Flight Information Display System</div>
        </div>
    </div>
    <div class="clock-block">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date-line" id="date-line">— — —</div>
    </div>
</header>

<!-- ─── Filters ────────────────────────────────────────── -->
<div class="controls">
    <span class="ctrl-label">Airport</span>
    <button class="filter-btn active" data-f="ALL">ALL</button>
    <div class="sep"></div>
    <button class="filter-btn" data-f="CDG">CDG</button>
    <button class="filter-btn" data-f="ORY">ORY</button>
    <button class="filter-btn" data-f="AGP">AGP</button>
    <button class="filter-btn" data-f="FCO">FCO</button>
    <button class="filter-btn" data-f="MXP">MXP</button>
    <button class="filter-btn" data-f="JFK">JFK</button>
    <button class="filter-btn" data-f="EWR">EWR</button>
    <div class="spacer"></div>
    <div class="live-pill">
        <div class="live-dot"></div>
        LIVE
    </div>
</div>

<!-- ─── Board ──────────────────────────────────────────── -->
<div class="board-meta">
    <span class="board-title">Active Flights</span>
    <span class="board-count" id="board-count"></span>
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>Flight</th>
                <th>Airline</th>
                <th>From</th>
                <th>To</th>
                <th>Departure</th>
                <th>Arrival</th>
                <th>Status</th>
                <th>Gate / Terminal</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<!-- ─── Legend ─────────────────────────────────────────── -->
<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--s-scheduled)"></div> Scheduled</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--s-boarding)"></div> Boarding</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--s-in_flight)"></div> In Flight</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--s-landed)"></div> Landed</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--s-arrived)"></div> Arrived</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--s-delayed)"></div> Delayed</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--s-cancelled)"></div> Cancelled</div>
</div>

<script>
const FLIGHTS = [
    {
        code: 'AF011', airline: 'Air France', aircraft: 'Airbus A380-800',
        from: { iata: 'CDG', name: 'Paris CDG' },
        to:   { iata: 'JFK', name: 'New York JFK' },
        depSched: '08:30', depActual: '08:30',
        arrSched: '11:50', arrEst: '11:50',
        status: 'in_flight', delay: 0, gate: 'K32', terminal: '2E',
    },
    {
        code: 'AF154', airline: 'Air France', aircraft: 'Boeing 777-200ER',
        from: { iata: 'CDG', name: 'Paris CDG' },
        to:   { iata: 'FCO', name: 'Rome Fiumicino' },
        depSched: '09:15', depActual: '09:38',
        arrSched: '11:20', arrEst: '11:43',
        status: 'delayed', delay: 23, gate: 'G14', terminal: '2F',
    },
    {
        code: 'VY9811', airline: 'Vueling', aircraft: 'Airbus A320neo',
        from: { iata: 'ORY', name: 'Paris Orly' },
        to:   { iata: 'AGP', name: 'Málaga Airport' },
        depSched: '07:00', depActual: null,
        arrSched: '09:30', arrEst: null,
        status: 'cancelled', delay: 0, gate: null, terminal: 'W',
    },
    {
        code: 'IB3461', airline: 'Iberia', aircraft: 'Airbus A321',
        from: { iata: 'AGP', name: 'Málaga Airport' },
        to:   { iata: 'CDG', name: 'Paris CDG' },
        depSched: '10:45', depActual: null,
        arrSched: '13:15', arrEst: null,
        status: 'boarding', delay: 0, gate: 'B22', terminal: 'T3',
    },
    {
        code: 'AZ610', airline: 'ITA Airways', aircraft: 'Airbus A330-200',
        from: { iata: 'FCO', name: 'Rome Fiumicino' },
        to:   { iata: 'JFK', name: 'New York JFK' },
        depSched: '11:00', depActual: '11:52',
        arrSched: '15:30', arrEst: '16:22',
        status: 'delayed', delay: 52, gate: 'G7', terminal: 'T3',
    },
    {
        code: 'UA185', airline: 'United Airlines', aircraft: 'Boeing 767-400ER',
        from: { iata: 'EWR', name: 'Newark Liberty' },
        to:   { iata: 'CDG', name: 'Paris CDG' },
        depSched: '17:35', depActual: null,
        arrSched: '07:25+1', arrEst: null,
        status: 'scheduled', delay: 0, gate: 'C120', terminal: 'C',
    },
    {
        code: 'TP454', airline: 'TAP Air Portugal', aircraft: 'Airbus A321LR',
        from: { iata: 'ORY', name: 'Paris Orly' },
        to:   { iata: 'LIS', name: 'Lisbon Airport' },
        depSched: '13:20', depActual: '13:20',
        arrSched: '15:05', arrEst: '15:05',
        status: 'in_flight', delay: 0, gate: 'J11', terminal: 'J',
    },
    {
        code: 'LH2342', airline: 'Lufthansa', aircraft: 'Airbus A319',
        from: { iata: 'MXP', name: 'Milan Malpensa' },
        to:   { iata: 'FRA', name: 'Frankfurt Airport' },
        depSched: '14:00', depActual: '14:00',
        arrSched: '15:25', arrEst: '15:25',
        status: 'landed', delay: 0, gate: 'A44', terminal: 'T1',
    },
    {
        code: 'DL402', airline: 'Delta Air Lines', aircraft: 'Airbus A350-900',
        from: { iata: 'JFK', name: 'New York JFK' },
        to:   { iata: 'CDG', name: 'Paris CDG' },
        depSched: '22:55', depActual: null,
        arrSched: '12:40+1', arrEst: null,
        status: 'scheduled', delay: 0, gate: 'B34', terminal: 'T4',
    },
    {
        code: 'FR8821', airline: 'Ryanair', aircraft: 'Boeing 737-800',
        from: { iata: 'ORY', name: 'Paris Orly' },
        to:   { iata: 'AGP', name: 'Málaga Airport' },
        depSched: '06:30', depActual: '06:30',
        arrSched: '09:00', arrEst: '09:00',
        status: 'arrived', delay: 0, gate: 'D05', terminal: 'D',
    },
];

const LABELS = {
    scheduled: 'Scheduled',
    boarding:  '▶ Boarding',
    departed:  'Departed',
    in_flight: '✈ In Flight',
    landed:    '▼ Landed',
    arrived:   'Arrived',
    delayed:   '⚠ Delayed',
    cancelled: '✕ Cancelled',
};

// ─── Clock ──────────────────────────────────────────────
const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function tick() {
    const n = new Date();
    document.getElementById('clock').textContent =
        `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    document.getElementById('date-line').textContent =
        `${DAYS[n.getDay()]} ${pad(n.getDate())} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
}
function pad(v) { return String(v).padStart(2, '0'); }

// ─── Render ─────────────────────────────────────────────
function render(filter) {
    const list = filter === 'ALL'
        ? FLIGHTS
        : FLIGHTS.filter(f => f.from.iata === filter || f.to.iata === filter);

    document.getElementById('board-count').textContent =
        `— ${list.length} flight${list.length !== 1 ? 's' : ''}`;

    if (!list.length) {
        document.getElementById('tbody').innerHTML =
            `<tr><td colspan="8"><div class="empty">NO FLIGHTS FOR THIS AIRPORT</div></td></tr>`;
        return;
    }

    document.getElementById('tbody').innerHTML = list.map(f => {
        const isLate = f.delay > 0;
        const isCx   = f.status === 'cancelled';

        const depActual = f.depActual
            ? `<span class="time-actual ${isLate ? 'late' : ''}">actual ${f.depActual}${isLate ? ` (+${f.delay}')` : ''}</span>`
            : '';

        const arrEst = f.arrEst && f.arrEst !== f.arrSched
            ? `<span class="time-actual late">est. ${f.arrEst}</span>`
            : '';

        const gateHtml = f.gate
            ? `${f.gate}<span class="term">TERMINAL ${f.terminal}</span>`
            : `—<span class="term">TERMINAL ${f.terminal}</span>`;

        return `<tr class="${isCx ? 'row-cancelled' : ''}">
            <td><span class="c-code">${f.code}</span></td>
            <td><span class="c-airline">${f.airline}</span></td>
            <td>
                <span class="iata">${f.from.iata}</span>
                <span class="apt-name">${f.from.name}</span>
            </td>
            <td>
                <span class="iata">${f.to.iata}</span>
                <span class="apt-name">${f.to.name}</span>
            </td>
            <td class="c-time">
                <span class="time-sched">${f.depSched}</span>
                ${depActual}
            </td>
            <td class="c-time">
                <span class="time-sched">${f.arrSched}</span>
                ${arrEst}
            </td>
            <td><span class="badge s-${f.status}">${LABELS[f.status] || f.status}</span></td>
            <td class="c-gate">${gateHtml}</td>
        </tr>`;
    }).join('');
}

// ─── Filter buttons ──────────────────────────────────────
let active = 'ALL';
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        active = btn.dataset.f;
        render(active);
    });
});

// ─── Init ────────────────────────────────────────────────
tick();
setInterval(tick, 1000);
render('ALL');
</script>
</body>
</html>
